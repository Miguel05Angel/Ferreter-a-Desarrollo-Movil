name: ferreteria_app
description: Sistema de gestion para ferreteria - productos, ventas, clientes, proveedores y cotizaciones.
publish_to: 'none'
version: 1.0.0+2

environment:
  # firebase_core 5.x y cloud_firestore 7.x exigen este minimo.
  sdk: ^3.6.0
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  intl: ^0.19.0
  url_launcher: ^6.3.1
  # Base de datos en la nube (Guia 13, secciones 2 y 3)
  firebase_core: ^5.1.0
  cloud_firestore: ^7.1.0
  # Sensores del telefono (Guia 13, seccion 1)
  sensors_plus: ^7.1.1
  # Compartir comprobantes (PDF e imagen)
  pdf: ^3.11.1
  share_plus: ^10.1.0
  path_provider: ^2.1.4
  qr_flutter: ^4.1.0
  # Google Maps
  google_maps_flutter: ^2.10.0
  # Imagenes reales, vista 360 y modelos 3D (.glb) desde Google Drive
  http: ^1.2.2
  cached_network_image: ^3.4.1
  model_viewer_plus: ^1.9.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
