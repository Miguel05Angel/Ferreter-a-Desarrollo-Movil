name: ferreteria_app
description: Sistema de gestion para ferreteria - productos, ventas, clientes, proveedores y cotizaciones.
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12
  cloud_functions: ^5.6.2
  provider: ^6.1.2
  intl: ^0.19.0
  url_launcher: ^6.3.1
  # Compartir comprobantes (PDF e imagen)
  pdf: ^3.11.1
  share_plus: ^10.1.0
  path_provider: ^2.1.4
  qr_flutter: ^4.1.0
  # Google Maps
  google_maps_flutter: ^2.10.0
  # Imagenes reales, vista 360 y modelos 3D (.glb) desde Google Drive
  http: ^1.2.2
  cached_network_image: ^3.4.1
  model_viewer_plus: ^1.9.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
